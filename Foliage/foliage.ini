; Retail bark materials whose trunks are drawn rounder and with a sharper bark. Round is how far a new vertex goes
; onto the curve, RoundMax the furthest it may move in units of the mesh. RepeatU and RepeatV are how often the bark runs over one
; repeat of the retail material, DetailScale how often the detail runs over one repeat of the bark. Both are whole
; numbers, or the bark would break where the retail one wraps.
; The Stitch mapping moves the pieces of the retail mapping so the bark runs through along the limbs.
; A bark with a TileSize takes no mapping at all. It lies along the three world axes, that many units to a repeat,
; so it has no seams on a mesh whose mapping cannot be stitched. Its grain does not follow the limbs.
; Shading goes into the light baked on each tree. Crease darkens bark within CreaseReach mesh units of another limb,
; Base darkens the foot up to BaseHeight world units over the ground and Ground pulls it toward the terrain's own
; light, Moss tints bark that faces up below MossHeight, TintJitter makes one tree differ from the next.
; Sway is how far the wind leans the top of the tree in radians. It only acts on maps that move the shadows of
; their trees, and only on trees whose twigs and leaves can be drawn along with the bark.
[Bark.JolchamOak]
Albedo=textures/BarkJolchamOak.dds
TileSize=160

[Bark.Pine]
Albedo=textures/BarkPine.dds
Detail=textures/BarkDetail.dds
DetailScale=6

